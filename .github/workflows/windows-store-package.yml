name: Build Microsoft Store package

on:
  pull_request:
    paths:
      - 'minemarker-mod/**'
      - 'timeline-viewer/**'
      - '.github/workflows/windows-store-package.yml'
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center Package/Identity/Name
        required: true
        type: string
      publisher:
        description: Partner Center Package/Identity/Publisher
        required: true
        type: string
      publisher_display_name:
        description: Partner Center PublisherDisplayName
        required: true
        default: MineMarker
        type: string

permissions:
  contents: read

jobs:
  build-store-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: timeline-viewer/package-lock.json
      - name: Build Fabric mod
        working-directory: minemarker-mod
        run: .\gradlew.bat clean build
      - name: Install desktop dependencies
        working-directory: timeline-viewer
        run: npm ci
      - name: Test timeline logic
        working-directory: timeline-viewer
        run: npm test
      - name: Build Store MSIX
        if: github.event_name == 'workflow_dispatch'
        working-directory: timeline-viewer
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: npm run desktop:store
      - name: Upload Store package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MineMarker-Store-MSIX
          path: timeline-viewer/desktop-dist/*.msix
          if-no-files-found: error
